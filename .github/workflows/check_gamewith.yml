name: 怪物彈珠日版攻略通知

on:
  schedule:
    # 每 5 分鐘自動檢測一次
    - cro: '*/5 * * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動發動測試

jobs:
  check-gamewith:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run GW scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.GW_DISCORD_WEBHOOK }}
        run: python gamewith.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gamewith_news.json
          git commit -m "Update GameWith cache" || exit 0
          git push
