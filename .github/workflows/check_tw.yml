name: 怪物彈珠繁中公告通知

on:
  schedule:
    # 每 5 分鐘自動執行一次
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest

    # 必須給予 Actions 寫入 Git 的權限
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tw.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update last_news.json" && git push)
